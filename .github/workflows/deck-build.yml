name: Deck test build

# Builds the mod on the user's own Windows PC (a self-hosted runner, because
# building a SMAPI mod needs the game installed) and publishes it to the
# rolling GitHub release "test-latest". Each Steam Deck installs that release
# the next time Stardew starts (deploy/deck/launch.sh).
#
#  - Every push to main publishes automatically.
#  - To test any other branch: Actions > Deck test build > Run workflow > pick the branch.
#
# Setup: docs/steam-deck-setup.md, part 1.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deck-build
  cancel-in-progress: true

jobs:
  build:
    # Only this private repo; never run fork code on the PC.
    if: github.repository == 'afterian/stardewenergistics'
    runs-on: [self-hosted, Windows, stardew]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build number into the mod version
        shell: powershell
        run: |
          $path = "src\StardewEnergistics\manifest.json"
          $text = [IO.File]::ReadAllText($path)
          $m = [regex]::Match($text, '"Version"\s*:\s*"([^"]+)"')
          if (-not $m.Success) { throw "No Version in $path" }
          $base = $m.Groups[1].Value
          $sep = if ($base.Contains('-')) { '.' } else { '-' }
          $version = "$base${sep}build.${{ github.run_number }}"
          $text = $text.Replace($m.Value, '"Version": "' + $version + '"')
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding $false))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "MOD_VERSION=$version`n")
          Write-Host "Mod version: $version"

      - name: Build
        shell: powershell
        env:
          STARDEW_GAME_PATH: ${{ vars.STARDEW_GAME_PATH }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "modzip"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          $buildArgs = @("build", "src\StardewEnergistics\StardewEnergistics.csproj", "-c", "Release",
                    "-p:EnableModDeploy=false", "-p:ModZipPath=$out")
          if ($env:STARDEW_GAME_PATH) { $buildArgs += "-p:GamePath=$env:STARDEW_GAME_PATH" }
          & dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Build failed - see errors above." }
          $zip = Get-ChildItem $out -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "No mod zip was made. Is EnableModZip on in the .csproj?" }
          Copy-Item $zip.FullName (Join-Path $env:RUNNER_TEMP "StardewEnergistics-test.zip") -Force

      - name: Publish to the test-latest release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & .\deploy\ci\publish-release.ps1 `
            -Zip (Join-Path $env:RUNNER_TEMP "StardewEnergistics-test.zip") `
            -Version $env:MOD_VERSION
